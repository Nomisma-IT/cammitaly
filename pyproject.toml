[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cammitaly"
version = "0.1.0"
description = "Acquisizione dati per mappare i cammini italiani sui comuni attraversati"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "pyogrio==0.13.0",
    "geopandas==1.2.0",
    "rapidfuzz==3.14.6",
    "osmium==4.3.2",
    "psutil==7.2.2",
    "openpyxl==3.1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
